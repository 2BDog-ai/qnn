name: Build Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Package
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release files
        run: Get-ChildItem -Path release -Recurse | Select-Object FullName, Length

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Wedding-Music-Player-win-x64
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

      - name: Publish Windows package to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Latest Windows Build
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            release/*.exe
            release/*.blockmap
