name: Build macOS Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }} Package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            suffix: mac-arm64
          - arch: x64
            runner: macos-15-intel
            suffix: mac-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show runner architecture
        run: |
          sw_vers
          uname -m

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare macOS FFmpeg
        run: node scripts/ensure-ffmpeg-mac.js

      - name: Prepare macOS Demucs
        run: node scripts/ensure-demucs-mac.js

      - name: Build app
        run: npm run build

      - name: Build macOS app directory
        run: npx electron-builder --mac dir --${{ matrix.arch }} --config.npmRebuild=false --config.compression=store
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find built app
        id: app
        run: |
          set -e
          APP_PATH="$(find release -maxdepth 3 -name 'YIYU.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "Could not find YIYU.app"
            find release -maxdepth 4 -type d
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "app_parent=$(dirname "$APP_PATH")" >> "$GITHUB_OUTPUT"
          echo "Found app at $APP_PATH"

      - name: Repair and sign macOS app
        run: |
          set -e
          APP="${{ steps.app.outputs.app_path }}"
          xattr -cr "$APP" || true
          chmod +x "$APP/Contents/MacOS/YIYU"
          chmod +x "$APP/Contents/Resources/ffmpeg/ffmpeg" || true
          chmod +x "$APP/Contents/Resources/ffmpeg/ffprobe" || true
          chmod +x "$APP/Contents/Resources/demucs/mac/demucs" || true
          find "$APP/Contents/Frameworks" -type f -perm -111 -exec chmod +x {} \; || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Zip macOS app
        run: |
          cd "${{ steps.app.outputs.app_parent }}"
          ditto -c -k --sequesterRsrc --keepParent "YIYU.app" "../YIYU-1.0.2-${{ matrix.suffix }}.zip"

      - name: Build macOS DMG
        run: |
          set -e
          APP="${{ steps.app.outputs.app_path }}"
          mkdir -p release/dmg-root
          cp -R "$APP" "release/dmg-root/"
          ln -s /Applications "release/dmg-root/Applications"
          cp scripts/install.sh "release/dmg-root/Install.command"
          cp scripts/macos-fix.sh "release/dmg-root/Repair.command"
          chmod +x "release/dmg-root/Install.command" "release/dmg-root/Repair.command"
          cat > "release/dmg-root/README.txt" <<'EOF'
          YIYU macOS

          Choose the right DMG first:
          - Apple Silicon / M1 / M2 / M3 / M4: use mac-arm64.dmg
          - Intel Mac: use mac-x64.dmg

          1. Double-click Install.command first.
          2. If macOS still says the app cannot be opened or is damaged, double-click Repair.command.
          3. You can also drag YIYU.app to Applications, then right-click it and choose Open.
          EOF
          hdiutil create \
            -volname "YIYU" \
            -srcfolder "release/dmg-root" \
            -ov \
            -format UDZO \
            "release/YIYU-1.0.2-${{ matrix.suffix }}.dmg"
          rm -rf release/dmg-root

      - name: List release files
        run: ls -lah release

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: Wedding-Music-Player-${{ matrix.suffix }}
          path: |
            release/*.dmg
          if-no-files-found: error
