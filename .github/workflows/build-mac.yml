name: Build macOS Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-macos:
    name: Build macOS arm64 Package
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Prepare macOS FFmpeg
        run: node scripts/ensure-ffmpeg-mac.js

      - name: Build app
        run: npm run build

      - name: Build macOS app directory
        run: npx electron-builder --mac dir --arm64 --config.npmRebuild=false --config.compression=store
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair and sign macOS app
        run: |
          set -e
          APP="release/mac-arm64/WeddingMusicPlayer.app"
          xattr -cr "$APP" || true
          chmod +x "$APP/Contents/MacOS/WeddingMusicPlayer"
          chmod +x "$APP/Contents/Resources/ffmpeg/ffmpeg" || true
          chmod +x "$APP/Contents/Resources/ffmpeg/ffprobe" || true
          chmod +x "$APP/Contents/Resources/demucs/mac/demucs" || true
          find "$APP/Contents/Frameworks" -type f -perm -111 -exec chmod +x {} \; || true
          codesign --force --deep --sign - --options runtime "$APP" || codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Zip macOS app
        run: |
          cd release/mac-arm64
          ditto -c -k --sequesterRsrc --keepParent "WeddingMusicPlayer.app" "../Wedding Music Player-1.0.0-arm64.zip"

      - name: Build macOS DMG
        run: |
          set -e
          mkdir -p release/dmg-root
          cp -R "release/mac-arm64/WeddingMusicPlayer.app" "release/dmg-root/"
          ln -s /Applications "release/dmg-root/Applications"
          cp scripts/install.sh "release/dmg-root/一键安装.command"
          cp scripts/macos-fix.sh "release/dmg-root/一键修复.command"
          chmod +x "release/dmg-root/一键安装.command" "release/dmg-root/一键修复.command"
          hdiutil create \
            -volname "Wedding Music Player" \
            -srcfolder "release/dmg-root" \
            -ov \
            -format UDZO \
            "release/Wedding Music Player-1.0.0-arm64.dmg"
          rm -rf release/dmg-root

      - name: List release files
        run: ls -lah release

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: Wedding-Music-Player-macOS-arm64
          path: |
            release/*
          if-no-files-found: error
