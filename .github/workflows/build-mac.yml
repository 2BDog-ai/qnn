name: Build macOS Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-macos:
    name: Build macOS arm64 Package
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Prepare macOS FFmpeg
        run: node scripts/ensure-ffmpeg-mac.js

      - name: Build app
        run: npm run build

      - name: Build macOS app directory
        run: npx electron-builder --mac dir --arm64 --config.npmRebuild=false --config.compression=store
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Zip macOS app
        run: |
          cd release/mac-arm64
          ditto -c -k --sequesterRsrc --keepParent "WeddingMusicPlayer.app" "../Wedding Music Player-1.0.0-arm64.zip"

      - name: List release files
        run: ls -lah release

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: Wedding-Music-Player-macOS-arm64
          path: |
            release/*
          if-no-files-found: error
